name: Publish Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/overlays/docker-local/kustomization.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TechChallenge.slnx

      - name: Build
        run: dotnet build TechChallenge.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/TechChallenge.Tests/TechChallenge.Tests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/TechChallenge.IntegrationTests/TechChallenge.IntegrationTests.csproj --configuration Release --no-build

  publish:
    name: Build and push image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate short image tag
        id: image_tag
        shell: bash
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/TechChallenge.Api/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Promote image in Kubernetes overlay
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.value }}
          OVERLAY_FILE: k8s/overlays/docker-local/kustomization.yaml
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced during the image build; the newer workflow will promote its own image."
            exit 0
          fi

          git checkout -B main origin/main
          perl -0pi -e 's/^([ \t]*newTag:).*$/$1 $ENV{IMAGE_TAG}/m' "$OVERLAY_FILE"

          if [ "$(awk '$1 == "newTag:" { print $2 }' "$OVERLAY_FILE")" != "$IMAGE_TAG" ]; then
            echo "Unable to update images[].newTag in $OVERLAY_FILE."
            exit 1
          fi

          if git diff --quiet -- "$OVERLAY_FILE"; then
            echo "The overlay already references image $IMAGE_TAG."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY_FILE"
          git commit -m "chore(k8s): promove imagem ${IMAGE_TAG} [skip ci]"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "main advanced before the promotion push; the newer workflow will promote its own image."
              exit 0
            fi

            echo "Unable to push the image promotion commit."
            exit 1
          fi
