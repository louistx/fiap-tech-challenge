name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TechChallenge.slnx

      - name: Build
        run: dotnet build TechChallenge.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/TechChallenge.Tests/TechChallenge.Tests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/TechChallenge.IntegrationTests/TechChallenge.IntegrationTests.csproj --configuration Release --no-build

  publish:
    name: Build and push image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate short image tag
        id: image_tag
        shell: bash
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/TechChallenge.Api/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
