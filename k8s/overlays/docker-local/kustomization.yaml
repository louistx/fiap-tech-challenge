apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: techchallenge
resources:
- namespace.yaml
- ../../base

secretGenerator:
- name: fiap-tech-challenge-api-secrets
  envs:
  - secrets.env

generatorOptions:
  disableNameSuffixHash: true

images:
- name: ghcr.io/louistx/fiap-tech-challenge
  newTag: latest
