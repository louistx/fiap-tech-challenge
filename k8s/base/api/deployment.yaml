apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-tech-challenge-api
  labels:
    app: fiap-tech-challenge-api
spec:
  # Sem replicas fixo para permitir que o HPA do overlay controle a escala.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: fiap-tech-challenge-api
  template:
    metadata:
      labels:
        app: fiap-tech-challenge-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
        - name: api
          image: ghcr.io/louistx/fiap-tech-challenge:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: techchallenge-api-config
            - secretRef:
                name: techchallenge-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
