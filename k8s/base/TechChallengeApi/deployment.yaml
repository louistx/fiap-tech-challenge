apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-tech-challenge-api
  labels:
    app: fiap-tech-challenge-api
spec:
  selector:
    matchLabels:
      app: fiap-tech-challenge-api
      tier: server
  replicas: 2
  template:
    metadata:
      labels:
        app: fiap-tech-challenge-api
        tier: server
        backstage.io/kubernetes-id: fiap-tech-challenge-api
    spec:
      containers:
      - image: ghcr.io/louistx/fiap-tech-challenge
        imagePullPolicy: Always
        name: fiap-tech-challenge-api
        envFrom:
          - configMapRef:
              name: fiap-tech-challenge-api-config
          - secretRef:
              name: fiap-tech-challenge-api-secrets
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
