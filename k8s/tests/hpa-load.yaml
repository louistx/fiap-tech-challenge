apiVersion: batch/v1
kind: Job
metadata:
  name: techchallenge-hpa-load
  namespace: techchallenge
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: load
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              end=$(( $(date +%s) + 120 ))
              for worker in $(seq 1 12); do
                (
                  while [ "$(date +%s)" -lt "$end" ]; do
                    wget -q -O /dev/null http://fiap-tech-challenge-api-service:8080/health/ready || true
                  done
                ) &
              done
              wait
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
